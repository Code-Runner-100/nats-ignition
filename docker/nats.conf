# NATS standalone — JetStream + MQTT
# No leaf nodes, no hub. Single server

port: 4222
http_port: 8222
server_name: "nats"

# JetStream: enables persistent streams and consumers
jetstream: enabled

jetstream {
  store_dir: "/data/jetstream"
}

# Accounts: single DEFAULT account with one user
# Add users here if you need more than one credential set
accounts {
  DEFAULT: {
    users: [
      { user: "nats-client", password: "natspass123" }
    ]
    jetstream: enabled
  }
}

# MQTT bridge: listens on 1883 inside the container
# Map to a different host port in docker-compose.yml if 1883 is taken
mqtt {
  port: 1883
  ack_wait: "1m"
  max_ack_pending: 100

  # no_auth_user allows MQTT clients to connect without credentials
  # Maps to the nats-client user above
  no_auth_user: "nats-client"
}
